<footer class="footer" id="contacto">
    <div class="container">
        <div class="footer__top">
            <a class="brand" href="{% url 'core:home' %}">
                <span class="brand__text">
                    <span class="brand__title">PECADOS</span>
                    <span class="brand__sub">SABOR DEL CIELO</span>
                </span>
            </a>

            <div class="newsletter">
                <p class="newsletter__title">Únete a nuestro boletín</p>
                <p class="newsletter__sub">Sé el primero en conocer nuevas bebidas, postres y ediciones de temporada.</p>
                <form class="newsletter__form" id="newsletter-form" novalidate>
                    <label for="newsletter-email" class="sr-only">Correo electrónico</label>
                    <input
                        id="newsletter-email"
                        class="newsletter__input"
                        type="email"
                        name="email"
                        placeholder="Tu correo electrónico"
                        required
                    >
                    <button class="newsletter__submit" type="submit" aria-label="Suscribirme">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 12h14"/>
                            <path d="m12 5 7 7-7 7"/>
                        </svg>
                    </button>
                </form>
                <p class="newsletter__feedback" id="newsletter-feedback" aria-live="polite"></p>
            </div>

            <div class="socials" aria-label="Redes sociales">
                <a class="socials__link" href="#contacto" aria-label="Instagram">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                        <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
                    </svg>
                </a>
                <a class="socials__link" href="#contacto" aria-label="TikTok">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>
                    </svg>
                </a>
                <a class="socials__link" href="#contacto" aria-label="Pinterest">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.5 16.5 11 11"/>
                        <path d="M8.5 11.5a3.5 3.5 0 1 1 5.6 2.8c-.8.6-2 .5-2.6-.2"/>
                    </svg>
                </a>
                <a class="socials__link" href="#contacto" aria-label="WhatsApp">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/>
                    </svg>
                </a>
            </div>

            <div class="footer__tagline" aria-hidden="true">
                SABOR<br>DEL<br>CIELO
            </div>
        </div>

        <div class="footer__bottom">
            <p>&copy; {% now "Y" %} Pecados Sabor del Cielo. Todos los derechos reservados.</p>
            <div class="footer__legal">
                <a href="#contacto">Privacidad</a>
                <a href="#contacto">Términos</a>
                <a href="#contacto">Contacto</a>
            </div>
        </div>
    </div>
</footer>
